# =============================================================================
# preseed.cfg — fully automated Ubuntu 20.04 (Focal Fossa) DESKTOP install
#
# Used by build.sh, which bakes this file into the ISO as
# /preseed/custom.seed and passes it to ubiquity via the kernel command line:
#   file=/cdrom/preseed/custom.seed auto=true priority=critical
#   boot=casper automatic-ubiquity quiet splash noprompt noshell
#
# ⚠️  SECURITY: this file contains a DEFAULT user/password ("ubuntu").
#     Generate your own crypted password with:
#         openssl passwd -6
#     and replace the passwd/user-password-crypted value below BEFORE
#     building an ISO you will use anywhere real.
# =============================================================================

# ---------------------------------------------------------------------------
# Locale, keyboard, console
# ---------------------------------------------------------------------------
d-i debian-installer/locale string en_US
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/locale select en_US.UTF-8

d-i keyboard-configuration/layoutcode select us
d-i keyboard-configuration/modelcode string pc105
d-i keyboard-configuration/variantcode string
d-i console-setup/ask_detect boolean false
d-i console-setup/layoutcode string us
d-i console-setup/modelcode string pc105

ubiquity debian-installer/locale string en_US.UTF-8
ubiquity keyboard-configuration/layoutcode select us

# ---------------------------------------------------------------------------
# Network: DHCP, auto pick interface, hostname ubuntu
# ---------------------------------------------------------------------------
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string ubuntu
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string
ubiquity netcfg/get_hostname string ubuntu
ubiquity netcfg/get_domain string localdomain

# ---------------------------------------------------------------------------
# Clock / timezone
# ---------------------------------------------------------------------------
d-i clock-setup/utc boolean true
d-i clock-setup/utc-auto boolean true
d-i time/zone string America/Winnipeg
d-i clock-setup/ntp boolean true
ubiquity time/zone string America/Winnipeg

# ---------------------------------------------------------------------------
# Partitioning: wipe first disk, single ext4 partition + swap
# ---------------------------------------------------------------------------
# ubiquity (desktop installer) partitioning
ubiquity partman-auto/disk string /dev/sda
ubiquity partman-auto/method string regular
ubiquity partman-lvm/device_remove_lvm boolean true
ubiquity partman-md/device_remove_md boolean true
ubiquity partman-auto/choose_recipe select atomic

# d-i partman answers so partitioning never asks for confirmation
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ---------------------------------------------------------------------------
# Mirrors / apt components
# ---------------------------------------------------------------------------
d-i mirror/country string US
d-i mirror/http/hostname string archive.ubuntu.com
d-i mirror/http/directory string /ubuntu
d-i mirror/http/proxy string
d-i apt-setup/restricted boolean true
d-i apt-setup/universe boolean true
d-i apt-setup/multiverse boolean true
d-i apt-setup/backports boolean false
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.ubuntu.com

# ---------------------------------------------------------------------------
# User account
# ---------------------------------------------------------------------------
# Username: ubuntu   Full name: Ubuntu User   Password: ubuntu (CHANGE THIS)
d-i passwd/user-fullname string Ubuntu User
d-i passwd/username string ubuntu
# Generate a replacement with:  openssl passwd -6
d-i passwd/user-password-crypted password $6$eRzcYyR3Xw2elP6l$l7JXHXxbXRgD8KCx4xFt4q7aJFpsUfjjMHbfYZAlJ56GLSspojJ6ODxlauuauL72jYbwhEhGwUmzgImIVCFle0
d-i passwd/user-default-groups string adm audio cdrom dip lpadmin sudo plugdev sambashare video
d-i passwd/root-login boolean false
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false
ubiquity passwd/user-fullname string Ubuntu User
ubiquity passwd/username string ubuntu

# ---------------------------------------------------------------------------
# Packages: stock Ubuntu desktop + a few useful extras
# ---------------------------------------------------------------------------
tasksel tasksel/first multiselect ubuntu-desktop
d-i pkgsel/include string openssh-server vim curl git net-tools
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

# ---------------------------------------------------------------------------
# Boot loader (GRUB)
# ---------------------------------------------------------------------------
d-i grub-installer/grub2_instead_of_grub_legacy boolean true
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda
ubiquity grub-installer/bootdev string /dev/sda

# ---------------------------------------------------------------------------
# Finish: run commands in the installed system, then power off
# ---------------------------------------------------------------------------
d-i finish-install/reboot_in_progress note
d-i finish-install/keep-consoles boolean false

# Post-install: update package lists, remove the first-run setup wizard,
# install guest tools for VMs. Runs inside the new system (in-target).
ubiquity ubiquity/success_command string \
  in-target apt-get update; \
  in-target apt-get remove -y gnome-initial-setup; \
  in-target apt-get install -y open-vm-tools qemu-guest-agent;

# Power off when the install is done (swap the comments to reboot instead)
ubiquity ubiquity/poweroff boolean true
#ubiquity ubiquity/reboot boolean true
